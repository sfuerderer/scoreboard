[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "1.4.1"
version_scheme = "semver"
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
changelog_incremental = true
version_files = [
    "pom.xml:^    <version>",
    "src/main/java/system/Main.java:VERSION = ",
]
